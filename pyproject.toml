[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lpi-b2"
version = "0.1.0"
description = "LPI-B²: Latent Performance Indicator — Bootstrap-Bayesian estimator"
requires-python = ">=3.10"
dependencies = [
    "cmdstanpy>=1.2",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "scipy>=1.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lpi_b2*"]
